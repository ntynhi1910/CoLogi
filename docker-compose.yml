x-app-environment: &app-environment
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: cologi
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Run setup.sh or setup.ps1 first}
  DJANGO_SETTINGS_MODULE: config.settings.cp08_runtime
  COLOGI_CP11_ENABLED: "1"
  COLOGI_CP12_ENABLED: "1"
  COLOGI_CAPSTONE_SCENARIOS: v7-supplement-v1
  COLOGI_CP11_CAPSTONE_SCENARIO: v7-supplement-v1
  COLOGI_OUTLET_WORKSPACE_WRITES: "1"
  COLOGI_RELEASE_INSTALL: "1"

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: cologi
      POSTGRES_USER: cologi_installer
      POSTGRES_PASSWORD: ${COLOGI_DB_ADMIN_PASSWORD:?Run setup.sh or setup.ps1 first}
      COLOGI_DB_RUNTIME_PASSWORD: ${COLOGI_DB_RUNTIME_PASSWORD:?Run setup.sh or setup.ps1 first}
    volumes:
      - cologi_data:/var/lib/postgresql/data
      - ./database:/release-db:ro
      - ./deploy/restore.sh:/docker-entrypoint-initdb.d/10-cologi.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'test -f "$$PGDATA/.cologi-restored" && pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d cologi']
      interval: 4s
      timeout: 3s
      retries: 30
  bootstrap:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    environment:
      <<: *app-environment
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_USER: cologi_installer
      POSTGRES_PASSWORD: ${COLOGI_DB_ADMIN_PASSWORD:?Run setup.sh or setup.ps1 first}
      COLOGI_DEMO_PASSWORD: ${COLOGI_DEMO_PASSWORD:?Run setup.sh or setup.ps1 first}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-ec", "python manage.py migrate --check && python ../deploy/install_demo_passwords.py"]
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    environment:
      <<: *app-environment
      POSTGRES_USER: cologi_cp08_runtime
      POSTGRES_PASSWORD: ${COLOGI_DB_RUNTIME_PASSWORD:?Run setup.sh or setup.ps1 first}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health/ready/', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 12
  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '127.0.0.1:${COLOGI_FRONTEND_PORT:-15173}:80'
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/api/health/ready/']
      interval: 5s
      timeout: 4s
      retries: 12

volumes:
  cologi_data:
